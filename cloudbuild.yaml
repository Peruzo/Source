substitutions:
  _REGION: europe-north1
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: configure-docker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - auth
      - configure-docker
      - ${_REGION}-docker.pkg.dev
      - --quiet

  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        if [ "$BRANCH_NAME" = "main" ]; then
          SERVICE="source"
        elif [ "$BRANCH_NAME" = "staging" ]; then
          SERVICE="source-staging"
        else
          SERVICE="source-develop"
        fi
        IMAGE="${_REGION}-docker.pkg.dev/sigma-future-479409-h9/source-services/${SERVICE}:${COMMIT_SHA}"
        docker build -t $IMAGE -f Dockerfile .
        echo $IMAGE > /workspace/image.txt
    waitFor: ["configure-docker"]

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker push $(cat /workspace/image.txt)
    waitFor: ["build"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE=$(cat /workspace/image.txt)
        if [ "$BRANCH_NAME" = "main" ]; then
          SERVICE="source"
          SECRETS="AUTH0_CLIENT_SECRET=AUTH0_CLIENT_SECRET:latest,\
AUTH0_CLIENT_ID=AUTH0_CLIENT_ID:latest,\
AUTH0_DOMAIN=AUTH0_DOMAIN:latest,\
AUTH0_SECRET=AUTH0_SECRET:latest,\
APP_BASE_URL=APP_BASE_URL:latest,\
ADMIN_PORTAL_URL=ADMIN_PORTAL_URL:latest,\
ADMIN_SHARED_SECRET=ADMIN_SHARED_SECRET:latest,\
STRIPE_PLATFORM_SECRET=STRIPE_PLATFORM_SECRET:latest,\
GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest,\
GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,\
GCS_BUCKET_CODE_PACKAGES=GCS_BUCKET_CODE_PACKAGES:latest,\
GITHUB_WORKER_URL=GITHUB_WORKER_URL:latest,\
MONGO_URI=MONGO_URI:latest,\
CUSTOMER_PORTAL_URL=CUSTOMER_PORTAL_URL:latest"
        elif [ "$BRANCH_NAME" = "staging" ]; then
          SERVICE="source-staging"
          SECRETS="AUTH0_CLIENT_SECRET=AUTH0_CLIENT_SECRET_STAGING:latest,\
AUTH0_CLIENT_ID=AUTH0_CLIENT_ID_STAGING:latest,\
AUTH0_DOMAIN=AUTH0_DOMAIN_STAGING:latest,\
AUTH0_SECRET=AUTH0_SECRET_STAGING:latest,\
APP_BASE_URL=APP_BASE_URL_STAGING:latest,\
ADMIN_PORTAL_URL=ADMIN_PORTAL_URL_STAGING:latest,\
ADMIN_SHARED_SECRET=ADMIN_SHARED_SECRET:latest,\
STRIPE_PLATFORM_SECRET=STRIPE_PLATFORM_SECRET_STAGING:latest,\
GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest,\
GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,\
GCS_BUCKET_CODE_PACKAGES=GCS_BUCKET_CODE_PACKAGES:latest,\
GITHUB_WORKER_URL=GITHUB_WORKER_URL:latest,\
MONGO_URI=MONGO_URI_STAGING:latest,\
CUSTOMER_PORTAL_URL=CUSTOMER_PORTAL_URL_STAGING:latest"
        else
          SERVICE="source-develop"
          SECRETS="AUTH0_CLIENT_SECRET=AUTH0_CLIENT_SECRET_DEVELOP:latest,\
AUTH0_CLIENT_ID=AUTH0_CLIENT_ID_DEVELOP:latest,\
AUTH0_DOMAIN=AUTH0_DOMAIN_DEVELOP:latest,\
AUTH0_SECRET=AUTH0_SECRET_DEVELOP:latest,\
APP_BASE_URL=APP_BASE_URL_DEVELOP:latest,\
ADMIN_PORTAL_URL=ADMIN_PORTAL_URL_DEVELOP:latest,\
ADMIN_SHARED_SECRET=ADMIN_SHARED_SECRET:latest,\
STRIPE_PLATFORM_SECRET=STRIPE_PLATFORM_SECRET_DEVELOP:latest,\
GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest,\
GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,\
GCS_BUCKET_CODE_PACKAGES=GCS_BUCKET_CODE_PACKAGES:latest,\
GITHUB_WORKER_URL=GITHUB_WORKER_URL:latest,\
MONGO_URI=MONGO_URI_DEVELOP:latest,\
CUSTOMER_PORTAL_URL=CUSTOMER_PORTAL_URL_DEVELOP:latest"
        fi
        gcloud run deploy $SERVICE \
          --image=$IMAGE \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --service-account=source-run-sa@sigma-future-479409-h9.iam.gserviceaccount.com \
          --update-secrets=$SECRETS
    waitFor: ["push"]